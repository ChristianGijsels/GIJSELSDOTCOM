<!doctype html>
<html lang="nl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Calculator</title>
    <style>
      :root {
        font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
        color-scheme: dark;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: radial-gradient(circle at top, #2a2f45 0%, #12151f 60%);
      }

      .calculator {
        width: min(92vw, 360px);
        background: #1a1f2b;
        border-radius: 16px;
        padding: 16px;
        box-shadow: 0 20px 40px rgb(0 0 0 / 40%);
      }

      .display {
        width: 100%;
        border: none;
        border-radius: 10px;
        padding: 14px;
        box-sizing: border-box;
        margin-bottom: 12px;
        background: #0f1320;
        color: #f7f9ff;
        text-align: right;
        font-size: 2rem;
        min-height: 68px;
      }

      .buttons {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 10px;
      }

      button {
        border: none;
        border-radius: 10px;
        padding: 14px;
        font-size: 1.1rem;
        cursor: pointer;
        background: #2d3448;
        color: #f7f9ff;
      }

      button:hover {
        filter: brightness(1.1);
      }

      .operator {
        background: #3b63ff;
      }

      .clear {
        background: #ff4e6a;
      }

      .equal {
        background: #25c084;
        grid-column: span 2;
      }

      .zero {
        grid-column: span 2;
      }
    </style>
  </head>
  <body>
    <main class="calculator" aria-label="Calculator">
      <input class="display" id="display" type="text" value="0" readonly />
      <div class="buttons">
        <button type="button" class="clear" data-action="clear">C</button>
        <button type="button" data-action="delete">⌫</button>
        <button type="button" class="operator" data-value="/">÷</button>
        <button type="button" class="operator" data-value="*">×</button>

        <button type="button" data-value="7">7</button>
        <button type="button" data-value="8">8</button>
        <button type="button" data-value="9">9</button>
        <button type="button" class="operator" data-value="-">−</button>

        <button type="button" data-value="4">4</button>
        <button type="button" data-value="5">5</button>
        <button type="button" data-value="6">6</button>
        <button type="button" class="operator" data-value="+">+</button>

        <button type="button" data-value="1">1</button>
        <button type="button" data-value="2">2</button>
        <button type="button" data-value="3">3</button>
        <button type="button" data-action="decimal">.</button>

        <button type="button" class="zero" data-value="0">0</button>
        <button type="button" class="equal" data-action="calculate">=</button>
      </div>
    </main>

    <script>
      const display = document.getElementById('display');
      const buttons = document.querySelector('.buttons');
      let expression = '';

      function updateDisplay(value) {
        display.value = value || '0';
      }

      function appendValue(value) {
        expression += value;
        updateDisplay(expression);
      }

      function addDecimal() {
        const parts = expression.split(/[+\-*/]/);
        const currentNumber = parts[parts.length - 1];
        if (!currentNumber.includes('.')) {
          appendValue('.');
        }
      }

      function safeEvaluate(expr) {
        if (!expr || /[+\-*/.]$/.test(expr)) {
          return expression;
        }

        try {
          const result = Function(`"use strict"; return (${expr})`)();
          if (Number.isFinite(result)) {
            return String(result);
          }
        } catch {
          return 'Fout';
        }

        return 'Fout';
      }

      buttons.addEventListener('click', (event) => {
        const button = event.target.closest('button');
        if (!button) return;

        const value = button.dataset.value;
        const action = button.dataset.action;

        if (value) {
          if (display.value === 'Fout') expression = '';
          appendValue(value);
          return;
        }

        if (action === 'clear') {
          expression = '';
          updateDisplay(expression);
        } else if (action === 'delete') {
          expression = expression.slice(0, -1);
          updateDisplay(expression);
        } else if (action === 'decimal') {
          if (display.value === 'Fout') expression = '';
          addDecimal();
        } else if (action === 'calculate') {
          expression = safeEvaluate(expression);
          updateDisplay(expression);
        }
      });

      window.addEventListener('keydown', (event) => {
        const allowed = /[0-9+\-*/.]/;

        if (event.key === 'Enter') {
          expression = safeEvaluate(expression);
          updateDisplay(expression);
        } else if (event.key === 'Backspace') {
          expression = expression.slice(0, -1);
          updateDisplay(expression);
        } else if (event.key.toLowerCase() === 'c') {
          expression = '';
          updateDisplay(expression);
        } else if (allowed.test(event.key)) {
          if (event.key === '.') {
            addDecimal();
          } else {
            appendValue(event.key);
          }
        }
      });
    </script>
  </body>
</html>
